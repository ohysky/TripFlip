name: 숙소 API 확인 (임시)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Hotellook cache
        env:
          T: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: |
          curl -sS -m 30 -w "\nHTTP %{http_code}\n" "https://engine.hotellook.com/api/v2/cache.json?location=Nha%20Trang&currency=krw&checkIn=2026-12-20&checkOut=2026-12-23&limit=5&token=$T" | head -c 1500
          echo
          curl -sS -m 30 -w "\nHTTP %{http_code}\n" "https://engine.hotellook.com/api/v2/lookup.json?query=Nha%20Trang&lang=en&lookFor=both&limit=3&token=$T" | head -c 1000
      - name: Xotelo
        run: |
          curl -sS -m 30 -w "\nHTTP %{http_code}\n" "https://data.xotelo.com/api/search?query=Nha%20Trang" | head -c 1200
          echo
          curl -sS -m 30 -w "\nHTTP %{http_code}\n" "https://data.xotelo.com/api/list?location_key=g293928&limit=3" | head -c 1500
