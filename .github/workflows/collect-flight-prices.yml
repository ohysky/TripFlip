name: 항공권 가격 수집

# 가격 데이터는 앱 배포와 분리하려고 data 브랜치에만 쌓는다.
on:
  schedule:
    - cron: "0 0,6,12,18 * * *" # 매일 09·15·21·03시 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: store
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/collect-flight-prices.mjs store/flight-prices
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
      - name: 결과 커밋
        working-directory: store
        run: |
          git config user.name "tripflip-bot"
          git config user.email "tripflip-bot@users.noreply.github.com"
          git add flight-prices
          git diff --cached --quiet || git commit -m "항공권 가격 수집 $(date -u +%F_%H)"
          git push
