name: 장소 좌표 찾기

# 등급 매긴 장소 중 좌표 없는 곳을 위키데이터·노미나팀으로 찾는다. 수동 실행, 결과는 data 브랜치 places/에만 둔다.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-branch

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: store
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/geocode-places.mjs store/places
      - name: 결과 커밋
        working-directory: store
        run: |
          git config user.name "tripflip-bot"
          git config user.email "tripflip-bot@users.noreply.github.com"
          git add places
          git diff --cached --quiet || git commit -m "장소 좌표 $(date -u +%F)"
          git pull --rebase
          git push
