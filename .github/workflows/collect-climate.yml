name: 권역 날씨 평년값

# 전 세계 권역 월별 평년 날씨(NASA POWER). 수동 실행, 결과는 data 브랜치 climate/에만 둔다.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "권역 id 쉼표 구분 (비우면 전체)"
        required: false

permissions:
  contents: write

concurrency:
  group: data-branch

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: store
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/collect-climate.mjs store/climate
        env:
          ONLY: ${{ inputs.only }}
      - name: 결과 커밋
        working-directory: store
        run: |
          git config user.name "tripflip-bot"
          git config user.email "tripflip-bot@users.noreply.github.com"
          git add climate
          git diff --cached --quiet || git commit -m "권역 날씨 $(date -u +%F)"
          git pull --rebase
          git push
